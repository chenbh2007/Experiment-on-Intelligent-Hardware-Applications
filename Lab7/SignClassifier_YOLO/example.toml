[YOLO]
base = 16
num_bottleneck = 1
enable_shortcut = true
r_C2f = 0.5
r_bottleneck = 0.5

[model]
state_file = "./runs/mute_test/state.pt"
best_state_file = "./runs/mute_test/best.pt"

[data]
train_annotations_dir = "./dataset/train/annotations"
train_picture_dir = "./dataset/train/images"
eval_annotations_dir = "./dataset/eval/annotations"
eval_picture_dir = "./dataset/eval/images"
width = 512
height = 512

[control]
batch_size = 4
workers = 4
opt_every_step = 1
save_every_step = 20
test_every_step = 20

[loss]
l_cls = 0.5
l_box = 1.0
l_ctr = 0.8
alpha = 0.25
gamma = 2.0
box_threshold = 0.25

[optim]
lr = 1e-4
weight_decay = 0.01
eps = 1e-8
checkpoint = "./runs/mute_test/optim_checkpoint.pt"

[log]
log_every_step = 1
log_dir = "./runs/mute_test/logs"

[predict]
device = "cpu"
conf_threshold = 0.6
box_threshold = 0.25
camera = "/dev/video0"
